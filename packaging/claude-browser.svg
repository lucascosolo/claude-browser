<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Deliberately flat and legible at 16px: a browser bar, a page, one spark.
       No gradients or thin strokes -- both vanish in an XFCE panel. -->
  <rect x="4" y="8" width="56" height="48" rx="9" fill="#1c1e22"/>
  <rect x="4" y="8" width="56" height="16" rx="9" fill="#2b2f34"/>
  <rect x="4" y="17" width="56" height="7" fill="#2b2f34"/>

  <!-- the three dots of a window bar -->
  <circle cx="14" cy="16" r="2.4" fill="#6b7178"/>
  <circle cx="22" cy="16" r="2.4" fill="#6b7178"/>
  <circle cx="30" cy="16" r="2.4" fill="#6b7178"/>

  <!-- the omnibox -->
  <rect x="37" y="12.5" width="17" height="7" rx="3.5" fill="#16171a"/>

  <!-- page content, with the last line short so it reads as text -->
  <rect x="13" y="32" width="26" height="4" rx="2" fill="#4a5058"/>
  <rect x="13" y="41" width="34" height="4" rx="2" fill="#3a4048"/>

  <!-- the spark: this is the AI half of the browser -->
  <path d="M46 30 l2.6 6.4 6.4 2.6 -6.4 2.6 -2.6 6.4 -2.6 -6.4 -6.4 -2.6 6.4 -2.6 z"
        fill="#6aa9ff"/>
</svg>
