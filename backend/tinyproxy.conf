# cb-vpn tinyproxy template. Rendered by entrypoint.sh, which appends the
# BasicAuth line from the environment. Do not put credentials in this file.

User tinyproxy
Group tinyproxy

# Inside the container only. The tailnet-only exposure is done by the host port
# publish (100.91.16.6:8888:8888) in docker-compose.yml, not here.
Port 8888
Listen 0.0.0.0

Timeout 600
MaxClients 100

DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"

# Warning, deliberately. Info/Connect log every request line, which on this proxy
# is the user's browsing history — including private-mode browsing — sitting in
# `docker logs` on a VPS. Errors still surface; URLs do not.
LogLevel Warning

# No LogFile: at Warning there is nothing worth persisting, and stdout means the
# little that is emitted lives in the container's ring buffer rather than a file
# that grows unnoticed.

# Do not advertise the proxy to origin servers.
DisableViaHeader Yes

# First line of SSRF defence: destination host must not match filter.deny.
# FilterDefaultDeny Off = allow-list-free, deny-list-driven; the browser has to be
# able to reach the open web, so a default-deny here is not workable.
Filter "/opt/cb-vpn/filter.deny"
FilterURLs Off
# ere = POSIX extended regex. (FilterExtended On is the 1.10 spelling and still
# works, but logs a deprecation warning on every start.)
FilterType ere
FilterCaseSensitive Off
FilterDefaultDeny Off

# CONNECT to 443 and 80 only. Without this, tinyproxy tunnels arbitrary TCP and
# the proxy becomes a general-purpose port scanner for anything that can reach it.
ConnectPort 443
ConnectPort 80

# Client ACL. Which of these actually matches depends on whether Docker's publish
# path preserves the source address (DNAT) or rewrites it (userland proxy), so
# both the tailnet CGNAT range and this stack's bridge subnet are listed. This is
# defence in depth only — the bind address is what keeps the public internet out.
Allow 100.64.0.0/10
Allow 172.31.250.0/28
